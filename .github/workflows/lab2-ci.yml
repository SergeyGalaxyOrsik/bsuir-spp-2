name: lab2-ci

on:
  push:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-ci.yml"
  pull_request:
    paths:
      - "lab2/**"
      - ".github/workflows/lab2-ci.yml"

concurrency:
  group: lab2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lab2

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prompts
          POSTGRES_PASSWORD: prompts
          POSTGRES_DB: prompts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://prompts:prompts@localhost:5432/prompts_test
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('lab2/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
        working-directory: lab2
      - run: docker compose build
        working-directory: lab2
      - name: Start the stack and probe it
        working-directory: lab2
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/auth/me || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Dump logs on failure
        if: failure()
        working-directory: lab2
        run: docker compose logs
