name: geopulse

x-service-env: &service-env
  DATABASE_URL: postgres://geopulse:geopulse@postgres:5432/geopulse
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-geopulse-internal-dev-token}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  NODE_ENV: production
  LOG_LEVEL: info

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse -d geopulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

  geo:
    <<: *service
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: services/geo } }
    environment: { <<: *service-env, PORT: "4001", OTEL_SERVICE_NAME: geo-subgraph }

  seismic:
    <<: *service
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: services/seismic } }
    environment: { <<: *service-env, PORT: "4002", OTEL_SERVICE_NAME: seismic-subgraph }
    # Two replicas behind Docker DNS: the gateway load-balances, advisory locks elect one ingester.
    deploy:
      replicas: 2

  hazards:
    <<: *service
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: services/hazards } }
    environment: { <<: *service-env, PORT: "4003", OTEL_SERVICE_NAME: hazards-subgraph }

  ops:
    <<: *service
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: services/ops } }
    environment:
      <<: *service-env
      PORT: "4004"
      OTEL_SERVICE_NAME: ops-subgraph
      SERVICE_URLS: geo=http://geo:4001,seismic=http://seismic:4002,hazards=http://hazards:4003,ops=http://ops:4004,gateway=http://gateway:4000

  gateway:
    <<: *service
    build: { context: ., dockerfile: infra/Dockerfile.service, args: { SERVICE: apps/gateway } }
    environment:
      <<: *service-env
      PORT: "4000"
      OTEL_SERVICE_NAME: gateway
      SUBGRAPHS: geo=http://geo:4001/graphql,seismic=http://seismic:4002/graphql,hazards=http://hazards:4003/graphql,ops=http://ops:4004/graphql
    depends_on:
      geo: { condition: service_healthy }
      seismic: { condition: service_healthy }
      hazards: { condition: service_healthy }
      ops: { condition: service_healthy }
    ports:
      - "${GATEWAY_PORT:-4000}:4000"

  web:
    restart: unless-stopped
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      PORT: "3000"
      GRAPHQL_URL: http://gateway:4000/graphql
      PUBLIC_GRAPHQL_URL: ${PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
