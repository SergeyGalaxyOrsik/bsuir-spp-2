apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: geopulse, tier: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger, app.kubernetes.io/part-of: geopulse, tier: observability }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: MEMORY_MAX_TRACES, value: "20000" }
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: ui, port: 16686, targetPort: 16686 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-public
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: ui, port: 8686, targetPort: 16686 }
