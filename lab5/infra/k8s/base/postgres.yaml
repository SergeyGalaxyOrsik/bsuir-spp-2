apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: { app.kubernetes.io/part-of: geopulse }
data:
  init.sql: |
    create extension if not exists pg_trgm;
    create extension if not exists cube;
    create extension if not exists earthdistance;
    create extension if not exists pg_stat_statements;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: geopulse, tier: data }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: geopulse, tier: data }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: geopulse }
            - { name: POSTGRES_DB, value: geopulse }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: geopulse-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "geopulse", "-d", "geopulse"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "geopulse", "-d", "geopulse"] }
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: geopulse }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
