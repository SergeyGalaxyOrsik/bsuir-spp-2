apiVersion: v1
kind: ConfigMap
metadata:
  name: geopulse-config
  labels: { app.kubernetes.io/part-of: geopulse }
data:
  NODE_ENV: production
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  # Service discovery through cluster DNS: every Service name resolves to its healthy pods.
  SUBGRAPHS: geo=http://geo:4001/graphql,seismic=http://seismic:4002/graphql,hazards=http://hazards:4003/graphql,ops=http://ops:4004/graphql
  SERVICE_URLS: geo=http://geo:4001,seismic=http://seismic:4002,hazards=http://hazards:4003,ops=http://ops:4004,gateway=http://gateway:4000
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  # Load control at the gateway (per pod).
  RATE_LIMIT_PER_SECOND: "20"
  RATE_LIMIT_BURST: "60"
  MAX_INFLIGHT_REQUESTS: "150"
  SEISMIC_BACKFILL_MONTHS: "24"
  # Poll USGS every minute so the live globe gets new quakes quickly.
  SEISMIC_INTERVAL_MS: "60000"
  HAZARDS_FROM_YEAR: "2019"
---
# Local development credentials. In a real cluster these come from a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: geopulse-secrets
  labels: { app.kubernetes.io/part-of: geopulse }
type: Opaque
stringData:
  POSTGRES_PASSWORD: geopulse
  DATABASE_URL: postgres://geopulse:geopulse@postgres:5432/geopulse
  INTERNAL_TOKEN: geopulse-k8s-internal-token
