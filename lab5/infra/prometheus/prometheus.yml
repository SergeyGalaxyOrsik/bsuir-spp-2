global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS service discovery returns every replica of a scaled service (seismic runs x2).
  - job_name: gateway
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 4000
    relabel_configs:
      - target_label: service
        replacement: gateway

  - job_name: geo
    dns_sd_configs:
      - names: ["geo"]
        type: A
        port: 4001
    relabel_configs:
      - target_label: service
        replacement: geo

  - job_name: seismic
    dns_sd_configs:
      - names: ["seismic"]
        type: A
        port: 4002
    relabel_configs:
      - target_label: service
        replacement: seismic

  - job_name: hazards
    dns_sd_configs:
      - names: ["hazards"]
        type: A
        port: 4003
    relabel_configs:
      - target_label: service
        replacement: hazards

  - job_name: ops
    dns_sd_configs:
      - names: ["ops"]
        type: A
        port: 4004
    relabel_configs:
      - target_label: service
        replacement: ops

  # Services started on the host with scripts/dev-backend.sh
  - job_name: local
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels: { service: gateway }
      - targets: ["host.docker.internal:4001"]
        labels: { service: geo }
      - targets: ["host.docker.internal:4002"]
        labels: { service: seismic }
      - targets: ["host.docker.internal:4003"]
        labels: { service: hazards }
      - targets: ["host.docker.internal:4004"]
        labels: { service: ops }
