scalar DateTime

type GeoPoint {
  latitude: Float!
  longitude: Float!
}

type Indicator {
  id: IndicatorId!
  worldBankCode: String!
  name: String!
  unit: String
  description: String
}

type IndicatorPoint {
  year: Int!
  value: Float
}

type IndicatorSeries {
  indicator: Indicator!
  points: [IndicatorPoint!]!
  latest: IndicatorPoint
  """
  Relative change between the first and the last non-null point, in percent.
  """
  changePct: Float
}

type IndicatorRank {
  rank: Int!
  country: Country!
  year: Int!
  value: Float!
}

type Weather {
  temperatureC: Float
  apparentTemperatureC: Float
  humidity: Float
  windSpeedKmh: Float
  windDirection: Float
  precipitationMm: Float
  weatherCode: Int
  description: String!
  isDay: Boolean
  observedAt: DateTime!
  location: GeoPoint!
}

type Language {
  code: ID!
  name: String!
  countryCount: Int!
  countries: [Country!]!
}

type Currency {
  code: ID!
  name: String!
  symbol: String
  countries: [Country!]!
}

type Region {
  name: String!
  countryCount: Int!
  population: Float
  areaKm2: Float
  subregions: [String!]!
  countries(sort: CountrySort): [Country!]!
}

"""
Fields contributed to entities owned by other subgraphs are nullable: if this subgraph is down,
the rest of the response still resolves (partial data + error) instead of nulling the parent.
"""
type Country {
  """
  ISO 3166-1 alpha-3 code.
  """
  code: ID!
  isoAlpha2: String!
  numericCode: String
  name: String!
  officialName: String!
  """
  Name in another language, ISO 639-3 key from the source dataset (e.g. rus, deu, fra).
  """
  localizedName(lang: String! = "rus"): String
  capital: String
  capitalLocation: GeoPoint
  region: String!
  subregion: String
  location: GeoPoint
  areaKm2: Float
  landlocked: Boolean!
  independent: Boolean
  unMember: Boolean!
  flag: String
  flagUrl: String
  topLevelDomains: [String!]!
  callingCodes: [String!]!
  incomeLevel: String
  population: Float
  gdpPerCapita: Float
  lifeExpectancy: Float
  """
  People per km².
  """
  density: Float
  neighbors: [Country!]!
  languages: [Language!]!
  currencies: [Currency!]!
  indicator(id: IndicatorId!, fromYear: Int, toYear: Int): IndicatorSeries
  indicators(ids: [IndicatorId!], fromYear: Int, toYear: Int): [IndicatorSeries!]!
  weather: Weather
  naturalEvents(
    filter: NaturalEventFilter
    sort: NaturalEventSort
    first: Int = 25
    after: String
  ): NaturalEventConnection
  hazardStats(filter: NaturalEventFilter): HazardStats
  earthquakes(filter: EarthquakeFilter, sort: EarthquakeSort, first: Int = 25, after: String): EarthquakeConnection
  """
  Latest events for this country — batched across countries in one SQL query.
  """
  recentEarthquakes(first: Int = 5, minMagnitude: Float): [Earthquake!]
  seismicStats(filter: EarthquakeFilter): EarthquakeStats
}

"""
Offset-paginated page (countries are a small, bounded set).
"""
type CountryPage {
  items: [Country!]!
  total: Int!
  limit: Int!
  offset: Int!
  hasMore: Boolean!
}

type Query {
  country(code: ID!): Country
  countries(filter: CountryFilter, sort: CountrySort, limit: Int = 20, offset: Int = 0): CountryPage!
  regions: [Region!]!
  languages(search: String, limit: Int = 50): [Language!]!
  currencies(search: String, limit: Int = 50): [Currency!]!
  indicators: [Indicator!]!
  indicatorRanking(
    id: IndicatorId!
    year: Int
    limit: Int = 10
    direction: SortDirection = DESC
    region: String
  ): [IndicatorRank!]!
  incomeLevels: [String!]!
  naturalEvent(id: ID!): NaturalEvent
  naturalEvents(
    filter: NaturalEventFilter
    sort: NaturalEventSort
    first: Int = 25
    after: String
  ): NaturalEventConnection!
  hazardCategories: [HazardCategory!]!
  hazardSources: [HazardSource!]!
  hazardStats(filter: NaturalEventFilter): HazardStats!
  hazardTimeline(filter: NaturalEventFilter, bucket: TimeBucket = MONTH): [HazardTimelinePoint!]!
  watchZones: [WatchZone!]!
  watchZone(id: ID!): WatchZone
  dataSources: [DataSource!]!
  dataSource(id: ID!): DataSource
  ingestRuns(source: ID, status: IngestStatus, first: Int = 20, after: String): IngestRunConnection!
  ingestRun(id: ID!): IngestRun
  """
  Total number of collected records across all sources.
  """
  totalRecords: Int!
  systemStatus: [ServiceStatus!]!
  earthquake(id: ID!): Earthquake
  earthquakes(filter: EarthquakeFilter, sort: EarthquakeSort, first: Int = 25, after: String): EarthquakeConnection!
  earthquakeStats(filter: EarthquakeFilter): EarthquakeStats!
  earthquakeTimeline(filter: EarthquakeFilter, bucket: TimeBucket = DAY): [TimeBucketCount!]!
  magnitudeHistogram(filter: EarthquakeFilter): [MagnitudeBin!]!
  topSeismicCountries(filter: EarthquakeFilter, limit: Int = 10): [CountrySeismicity!]!
  earthquakeTypes: [String!]!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type HazardCategory {
  id: ID!
  title: String!
  description: String
  eventCount(status: EventStatus): Int!
  events(
    filter: NaturalEventFilter
    sort: NaturalEventSort
    first: Int = 25
    after: String
  ): NaturalEventConnection!
}

type HazardSource {
  id: ID!
  title: String!
  url: String
  eventCount: Int!
}

type EventSourceLink {
  source: HazardSource!
  url: String
}

type EventMagnitude {
  value: Float!
  unit: String
}

type EventPoint {
  observedAt: DateTime!
  latitude: Float!
  longitude: Float!
  geometryType: String!
  magnitude: EventMagnitude
}

"""
Cross-domain correlation: earthquakes around a NASA EONET natural event (e.g. volcano unrest).
"""
type NaturalEvent {
  id: ID!
  title: String!
  description: String
  link: String
  status: EventStatus!
  startedAt: DateTime!
  lastObservedAt: DateTime!
  closedAt: DateTime
  durationDays: Float!
  """
  Latest observed position.
  """
  latitude: Float!
  longitude: Float!
  magnitude: EventMagnitude
  primaryCategory: HazardCategory!
  categories: [HazardCategory!]!
  sources: [EventSourceLink!]!
  pointCount: Int!
  """
  Observed positions over time (storm tracks, fire perimeters).
  """
  track(first: Int = 50): [EventPoint!]!
  country: Country
  """
  Other natural events within radiusKm active around the same time.
  """
  related(radiusKm: Float = 300, first: Int = 5): [NaturalEvent!]!
  nearbyEarthquakes(radiusKm: Float = 200, days: Int = 30, first: Int = 10): [Earthquake!]
}

type NaturalEventEdge {
  cursor: String!
  node: NaturalEvent!
}

type NaturalEventConnection {
  edges: [NaturalEventEdge!]!
  nodes: [NaturalEvent!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CategoryCount {
  category: HazardCategory!
  count: Int!
  open: Int!
}

type HazardStats {
  count: Int!
  open: Int!
  closed: Int!
  avgDurationDays: Float
  firstAt: DateTime
  lastAt: DateTime
  byCategory: [CategoryCount!]!
}

type HazardTimelinePoint {
  bucket: DateTime!
  count: Int!
}

"""
A user-defined circular area of interest. Seismic and hazards subgraphs attach matching events to it.
"""
type WatchZone {
  id: ID!
  latitude: Float!
  longitude: Float!
  radiusKm: Float!
  naturalEvents(first: Int = 10, days: Int = 30): [NaturalEvent!]
  naturalEventCount(days: Int = 30): Int
  name: String!
  description: String
  minMagnitude: Float!
  color: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  earthquakes(first: Int = 10, days: Int = 30): [Earthquake!]
  earthquakeCount(days: Int = 30): Int
}

type Subscription {
  """
  Emitted when the collector stores a new natural event or a fresh observation of an existing one.
  """
  naturalEventUpdated(categoryIds: [ID!]): NaturalEvent!
  ingestRunUpdated(source: ID): IngestRun!
  """
  Fires when the collector stores a previously unseen earthquake.
  """
  earthquakeDetected(minMagnitude: Float = 0): Earthquake!
}

type FieldError {
  field: String!
  message: String!
}

type WatchZonePayload {
  zone: WatchZone
  errors: [FieldError!]!
}

type DeletePayload {
  id: ID!
  deleted: Boolean!
}

type IngestRun {
  id: ID!
  source: DataSource!
  mode: IngestMode!
  triggeredBy: String!
  status: IngestStatus!
  progress: Float!
  message: String
  recordsFetched: Int!
  recordsUpserted: Int!
  totalRecords: Int
  warnings: [String!]!
  error: String
  startedAt: DateTime!
  finishedAt: DateTime
  durationMs: Int
  host: String
}

type IngestRunEdge {
  cursor: String!
  node: IngestRun!
}

type IngestRunConnection {
  edges: [IngestRunEdge!]!
  nodes: [IngestRun!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
An external system GeoPulse collects data from.
"""
type DataSource {
  id: ID!
  name: String!
  description: String!
  homepage: String!
  """
  Subgraph service that owns the collector and the data.
  """
  service: String!
  refreshInterval: String!
  health: SourceHealth!
  """
  Rows owned by this source after its last successful run.
  """
  recordCount: Int
  lastRun: IngestRun
  lastSuccessAt: DateTime
  runs(first: Int = 10, after: String, status: IngestStatus): IngestRunConnection!
}

type ServiceStatus {
  name: String!
  url: String!
  up: Boolean!
  latencyMs: Int
  detail: String
}

type TriggerIngestPayload {
  accepted: Boolean!
  runId: ID
  message: String!
}

type Mutation {
  createWatchZone(input: WatchZoneInput!): WatchZonePayload!
  updateWatchZone(id: ID!, patch: WatchZonePatch!): WatchZonePayload!
  deleteWatchZone(id: ID!): DeletePayload!
  """
  Asks the owning service to start a collector run; progress is streamed via `ingestRunUpdated`.
  """
  triggerIngest(source: ID!, mode: IngestMode = INCREMENTAL): TriggerIngestPayload!
}

type Earthquake {
  id: ID!
  time: DateTime!
  updatedAt: DateTime!
  magnitude: Float
  magnitudeType: String
  depthKm: Float
  latitude: Float!
  longitude: Float!
  place: String
  type: String!
  status: String
  tsunami: Boolean!
  alert: AlertLevel
  felt: Int
  cdi: Float
  mmi: Float
  significance: Int
  network: String
  url: String
  severity: Severity!
  """
  Radiated seismic energy estimate, log10 E = 1.5 M + 4.8 (Gutenberg-Richter).
  """
  energyJoules: Float
  country: Country
  """
  Other earthquakes within `radiusKm`, closest in time first.
  """
  nearby(radiusKm: Float = 150, first: Int = 5): [Earthquake!]!
  """
  Events that followed within `hours` and `radiusKm` — candidate aftershocks.
  """
  aftershocks(radiusKm: Float = 100, hours: Int = 72, first: Int = 20): [Earthquake!]!
}

type EarthquakeEdge {
  cursor: String!
  node: Earthquake!
}

type EarthquakeConnection {
  edges: [EarthquakeEdge!]!
  nodes: [Earthquake!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EarthquakeStats {
  count: Int!
  avgMagnitude: Float
  maxMagnitude: Float
  avgDepthKm: Float
  tsunamiCount: Int!
  feltReports: Int!
  totalEnergyJoules: Float
  firstAt: DateTime
  lastAt: DateTime
  strongest: Earthquake
}

type TimeBucketCount {
  bucket: DateTime!
  count: Int!
  maxMagnitude: Float
}

type MagnitudeBin {
  """
  Lower bound of a 0.5-wide bin.
  """
  from: Float!
  to: Float!
  count: Int!
}

type CountrySeismicity {
  country: Country!
  count: Int!
  maxMagnitude: Float
  avgMagnitude: Float
}

enum SortDirection {
  ASC
  DESC
}

"""
World Bank World Development Indicators tracked by GeoPulse.
"""
enum IndicatorId {
  POPULATION
  GDP
  GDP_PER_CAPITA
  LIFE_EXPECTANCY
  URBAN_POPULATION_PCT
  ELECTRICITY_ACCESS_PCT
  FOREST_AREA_PCT
  CO2_PER_CAPITA
}

enum CountrySortField {
  NAME
  POPULATION
  AREA
  DENSITY
  GDP_PER_CAPITA
  LIFE_EXPECTANCY
}

enum TimeBucket {
  HOUR
  DAY
  WEEK
  MONTH
}

enum EventStatus {
  OPEN
  CLOSED
}

enum NaturalEventSortField {
  STARTED_AT
  LAST_OBSERVED_AT
  MAGNITUDE
  TITLE
  DURATION
}

enum IngestMode {
  FULL
  INCREMENTAL
}

enum IngestStatus {
  RUNNING
  SUCCEEDED
  PARTIAL
  FAILED
  INTERRUPTED
}

enum SourceHealth {
  HEALTHY
  STALE
  FAILING
  UNKNOWN
}

enum AlertLevel {
  GREEN
  YELLOW
  ORANGE
  RED
}

"""
Descriptive class derived from magnitude (Richter scale bands).
"""
enum Severity {
  MICRO
  MINOR
  LIGHT
  MODERATE
  STRONG
  MAJOR
  GREAT
}

enum EarthquakeSortField {
  TIME
  MAGNITUDE
  DEPTH
  SIGNIFICANCE
  FELT
}

input FloatRange {
  min: Float
  max: Float
}

input CountryFilter {
  """
  Matches name, official name, Russian name, capital or code.
  """
  search: String
  regions: [String!]
  subregions: [String!]
  landlocked: Boolean
  independent: Boolean
  unMember: Boolean
  population: FloatRange
  areaKm2: FloatRange
  gdpPerCapita: FloatRange
  languageCodes: [String!]
  currencyCodes: [String!]
  incomeLevels: [String!]
  codes: [String!]
}

input CountrySort {
  field: CountrySortField! = NAME
  direction: SortDirection! = ASC
}

input TimeRange {
  from: DateTime
  to: DateTime
}

input GeoRadius {
  latitude: Float!
  longitude: Float!
  radiusKm: Float!
}

input NaturalEventFilter {
  """
  Case-insensitive substring match on the title.
  """
  search: String
  categoryIds: [ID!]
  sourceIds: [ID!]
  status: EventStatus
  started: TimeRange
  countryCodes: [String!]
  near: GeoRadius
  magnitude: FloatRange
  magnitudeUnit: String
  hasCountry: Boolean
}

input NaturalEventSort {
  field: NaturalEventSortField! = STARTED_AT
  direction: SortDirection! = DESC
}

input WatchZoneInput {
  name: String!
  description: String
  latitude: Float!
  longitude: Float!
  radiusKm: Float!
  minMagnitude: Float = 4
  color: String
}

input WatchZonePatch {
  name: String
  description: String
  latitude: Float
  longitude: Float
  radiusKm: Float
  minMagnitude: Float
  color: String
}

input EarthquakeFilter {
  """
  Case-insensitive substring match on the place description (trigram indexed).
  """
  search: String
  magnitude: FloatRange
  depthKm: FloatRange
  time: TimeRange
  """
  ISO 3166-1 alpha-3 country codes.
  """
  countryCodes: [String!]
  """
  Event type, e.g. earthquake, quarry blast, explosion.
  """
  types: [String!]
  alertLevels: [AlertLevel!]
  severities: [Severity!]
  tsunami: Boolean
  near: GeoRadius
  minSignificance: Int
  """
  Only events attributed to some country (true) or offshore/unknown (false).
  """
  hasCountry: Boolean
}

input EarthquakeSort {
  field: EarthquakeSortField! = TIME
  direction: SortDirection! = DESC
}